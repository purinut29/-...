<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งเตือนการมาสายและหนีเรียน</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { width: 100%; background: #e74c3c; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #c0392b; }
        .table-container { margin-top: 30px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; color: white; font-size: 12px; font-weight: bold; }
        .badge-late { background-color: #f39c12; }
        .badge-absent { background-color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h2>ระบบแจ้งเตือนการมาสาย / หนีเรียน</h2>
    
    <form id="attendanceForm">
        <div class="form-group">
            <label for="studentId">รหัสนักเรียน:</label>
            <input type="text" id="studentId" placeholder="เช่น 6601001" required>
        </div>
        
        <div class="form-group">
            <label for="studentName">ชื่อ-นามสกุล:</label>
            <input type="text" id="studentName" placeholder="เช่น นายสมชาย ใจดี" required>
        </div>
        
        <div class="form-group">
            <label for="status">สถานะ:</label>
            <select id="status" required>
                <option value="มาสาย">มาสาย</option>
                <option value="หนีเรียน">หนีเรียน</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="note">หมายเหตุ / คาบเรียน:</label>
            <textarea id="note" rows="2" placeholder="เช่น มาสายคาบ 1 / แอบออกนอกโรงเรียนคาบ 3"></textarea>
        </div>
        
        <button type="submit">บันทึกและส่งแจ้งเตือน</button>
    </form>

    <div class="table-container">
        <h3>ประวัติการบันทึก</h3>
        <table id="recordTable">
            <thead>
                <tr>
                    <th>เวลา</th>
                    <th>รหัส</th>
                    <th>ชื่อ-นามสกุล</th>
                    <th>สถานะ</th>
                    <th>หมายเหตุ</th>
                </tr>
            </thead>
            <tbody>
                <!-- ข้อมูลจะถูกเพิ่มที่นี่ -->
            </tbody>
        </table>
    </div>
</div>

<script>
    document.getElementById('attendanceForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const id = document.getElementById('studentId').value;
        const name = document.getElementById('studentName').value;
        const status = document.getElementById('status').value;
        const note = document.getElementById('note').value || '-';
        const timestamp = new Date().toLocaleString('th-TH');

        // แสดง Pop-up แจ้งเตือนทันที
        alert(`[แจ้งเตือนด่วน]\nนักเรียน: ${name} (${id})\nสถานะ: ${status}\nเวลา: ${timestamp}`);

        // เพิ่มข้อมูลลงในตาราง
        const tableBody = document.getElementById('recordTable').querySelector('tbody');
        const newRow = document.createElement('tr');
        
        const badgeClass = status === 'มาสาย' ? 'badge-late' : 'badge-absent';

        newRow.innerHTML = `
            <td>${timestamp}</td>
            <td>${id}</td>
            <td>${name}</td>
            <td><span class="badge ${badgeClass}">${status}</span></td>
            <td>${note}</td>
        `;

        tableBody.prepend(newRow);
        
        // ล้างค่าในฟอร์ม
        document.getElementById('attendanceForm').reset();
    });
</script>

</body>
</html>
